name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A fresh resolve every run: a yanked or broken upstream release shows
      # up here before it reaches an app.
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - name: Test
        run: cargo test
