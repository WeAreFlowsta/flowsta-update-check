[package]
name = "flowsta-update-check"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Verify a signed release manifest before an app installs an update: local Ed25519 checks against the app's own trusted signers, no server needed."
repository = "https://github.com/WeAreFlowsta/flowsta-update-check"
keywords = ["update", "release", "signature", "ed25519", "tauri"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
